name: CI

on:
  push:
    branches: [ main, fix/truthful-gate ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Run test suite with daemon UNREACHABLE (fail-closed verification)
        run: |
          SYSTEM_ONE_URL=http://127.0.0.1:9 python3 tests/test_live.py

      - name: Start HardTruth Daemon in background
        run: |
          python3 daemon/app.py &
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/health | grep -q "healthy"; then
              echo "Daemon is healthy"
              break
            fi
            sleep 1
          done

      - name: Run test suite with daemon UP (live NLI verification)
        run: |
          SYSTEM_ONE_URL=http://127.0.0.1:8000 python3 tests/test_live.py
